<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NEXUS Terminal v3.7.1</title>
    <link href="https://fonts.googleapis.com/css2?family=Share+Tech+Mono&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --neon-green: #00ff41;
            --dark-green: #003b00;
            --bg-dark: #0a0a0a;
            --red: #ff0040;
            --cyan: #00ffff;
            --purple: #bf00ff;
        }

        body {
            font-family: 'Share Tech Mono', monospace;
            background: var(--bg-dark);
            min-height: 100vh;
            overflow: hidden;
            position: relative;
            transition: all 0.5s ease;
        }

        body.darkweb-mode {
            --neon-green: #bf00ff;
            --dark-green: #3d0052;
            --cyan: #ff0066;
        }

        body.darkweb-mode .matrix-column {
            color: var(--purple);
            text-shadow: 0 0 10px var(--purple);
        }

        /* Flash Glitch Overlay */
        .flash-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: white;
            opacity: 0;
            pointer-events: none;
            z-index: 3000;
            transition: opacity 0.05s;
        }

        .flash-overlay.active {
            opacity: 0.8;
        }

        /* Scanline Effect */
        .scanlines {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            background: repeating-linear-gradient(
                0deg,
                rgba(0, 0, 0, 0.15),
                rgba(0, 0, 0, 0.15) 1px,
                transparent 1px,
                transparent 2px
            );
            z-index: 1000;
        }

        .crt-flicker {
            animation: flicker 0.15s infinite;
        }

        @keyframes flicker {
            0% { opacity: 0.97; }
            50% { opacity: 1; }
            100% { opacity: 0.98; }
        }

        /* Matrix Rain Background */
        .matrix-bg {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            opacity: 0.05;
            z-index: -1;
            overflow: hidden;
        }

        .matrix-column {
            position: absolute;
            top: -100%;
            font-size: 14px;
            color: var(--neon-green);
            animation: matrix-fall linear infinite;
            text-shadow: 0 0 10px var(--neon-green);
        }

        @keyframes matrix-fall {
            to { top: 100%; }
        }

        /* Terminal Container */
        .terminal-container {
            max-width: 1000px;
            margin: 20px auto;
            padding: 20px;
            height: calc(100vh - 40px);
            display: flex;
            flex-direction: column;
        }

        .terminal-header {
            background: linear-gradient(180deg, #1a1a1a 0%, #0d0d0d 100%);
            border: 1px solid var(--neon-green);
            border-bottom: none;
            border-radius: 10px 10px 0 0;
            padding: 10px 20px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            box-shadow: 0 0 20px rgba(0, 255, 65, 0.3), inset 0 0 20px rgba(0, 255, 65, 0.05);
        }

        .terminal-buttons {
            display: flex;
            gap: 8px;
        }

        .terminal-btn {
            width: 14px;
            height: 14px;
            border-radius: 50%;
            cursor: pointer;
            transition: all 0.3s;
        }

        .terminal-btn:hover {
            transform: scale(1.3);
            filter: brightness(1.5);
        }

        .btn-red { background: #ff5f56; box-shadow: 0 0 10px #ff5f56; }
        .btn-yellow { background: #ffbd2e; box-shadow: 0 0 10px #ffbd2e; }
        .btn-green { background: #27ca3f; box-shadow: 0 0 10px #27ca3f; }

        .btn-red:hover { box-shadow: 0 0 20px #ff5f56, 0 0 40px #ff5f56; }
        .btn-yellow:hover { box-shadow: 0 0 20px #ffbd2e, 0 0 40px #ffbd2e; }
        .btn-green:hover { box-shadow: 0 0 20px #27ca3f, 0 0 40px #27ca3f; }

        .terminal-title {
            color: var(--neon-green);
            font-size: 14px;
            text-shadow: 0 0 10px var(--neon-green);
            letter-spacing: 2px;
        }

        .terminal-status {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .status-dot {
            width: 8px;
            height: 8px;
            background: var(--neon-green);
            border-radius: 50%;
            animation: pulse 1s infinite;
        }

        @keyframes pulse {
            0%, 100% { opacity: 1; box-shadow: 0 0 10px var(--neon-green); }
            50% { opacity: 0.5; box-shadow: 0 0 5px var(--neon-green); }
        }

        .terminal-body {
            flex: 1;
            background: rgba(0, 10, 0, 0.95);
            border: 1px solid var(--neon-green);
            border-top: none;
            border-radius: 0 0 10px 10px;
            padding: 20px;
            overflow-y: auto;
            box-shadow: 0 0 30px rgba(0, 255, 65, 0.2), inset 0 0 50px rgba(0, 255, 65, 0.03);
            position: relative;
        }

        .terminal-body::-webkit-scrollbar {
            width: 8px;
        }

        .terminal-body::-webkit-scrollbar-track {
            background: #0a0a0a;
        }

        .terminal-body::-webkit-scrollbar-thumb {
            background: var(--dark-green);
            border-radius: 4px;
        }

        .terminal-body::-webkit-scrollbar-thumb:hover {
            background: var(--neon-green);
        }

        #output {
            color: var(--neon-green);
            font-size: 14px;
            line-height: 1.6;
            text-shadow: 0 0 5px var(--neon-green);
        }

        .output-line {
            margin-bottom: 5px;
            animation: fadeIn 0.1s ease-in;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateX(-10px); }
            to { opacity: 1; transform: translateX(0); }
        }

        .input-line {
            display: flex;
            align-items: center;
            margin-top: 10px;
        }

        .prompt {
            color: var(--cyan);
            margin-right: 10px;
            text-shadow: 0 0 10px var(--cyan);
        }

        #command-input {
            flex: 1;
            background: transparent;
            border: none;
            color: var(--neon-green);
            font-family: inherit;
            font-size: 14px;
            outline: none;
            text-shadow: 0 0 5px var(--neon-green);
            caret-color: var(--neon-green);
        }

        .cursor {
            display: inline-block;
            width: 10px;
            height: 18px;
            background: var(--neon-green);
            animation: blink 0.7s infinite;
            vertical-align: middle;
            box-shadow: 0 0 10px var(--neon-green);
        }

        @keyframes blink {
            0%, 50% { opacity: 1; }
            51%, 100% { opacity: 0; }
        }

        /* Command Menu */
        .command-menu {
            position: absolute;
            top: 10px;
            right: 10px;
            z-index: 100;
        }

        .menu-toggle {
            background: rgba(0, 255, 65, 0.1);
            border: 1px solid var(--neon-green);
            color: var(--neon-green);
            padding: 8px 15px;
            cursor: pointer;
            font-family: inherit;
            font-size: 12px;
            border-radius: 5px;
            transition: all 0.3s;
            text-shadow: 0 0 5px var(--neon-green);
        }

        .menu-toggle:hover {
            background: rgba(0, 255, 65, 0.3);
            box-shadow: 0 0 20px var(--neon-green);
            transform: scale(1.05);
        }

        .menu-dropdown {
            display: none;
            position: absolute;
            top: 100%;
            right: 0;
            background: rgba(0, 10, 0, 0.98);
            border: 1px solid var(--neon-green);
            border-radius: 5px;
            margin-top: 5px;
            min-width: 200px;
            box-shadow: 0 0 30px rgba(0, 255, 65, 0.3);
        }

        .menu-dropdown.active {
            display: block;
            animation: menuSlide 0.3s ease;
        }

        @keyframes menuSlide {
            from { opacity: 0; transform: translateY(-10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .menu-item {
            padding: 10px 15px;
            cursor: pointer;
            transition: all 0.2s;
            border-bottom: 1px solid rgba(0, 255, 65, 0.2);
            color: var(--neon-green);
        }

        .menu-item:last-child {
            border-bottom: none;
        }

        .menu-item:hover {
            background: rgba(0, 255, 65, 0.2);
            padding-left: 20px;
            text-shadow: 0 0 10px var(--neon-green);
        }

        .menu-item span {
            color: var(--cyan);
            margin-right: 10px;
        }

        /* Special Text Styles */
        .text-red {
            color: var(--red) !important;
            text-shadow: 0 0 10px var(--red) !important;
        }

        .text-cyan {
            color: var(--cyan) !important;
            text-shadow: 0 0 10px var(--cyan) !important;
        }

        .text-yellow {
            color: #ffff00 !important;
            text-shadow: 0 0 10px #ffff00 !important;
        }

        .text-white {
            color: #ffffff !important;
            text-shadow: 0 0 5px #ffffff !important;
        }

        .text-purple {
            color: var(--purple) !important;
            text-shadow: 0 0 10px var(--purple) !important;
        }

        /* Access Granted Animation */
        .access-granted {
            color: var(--neon-green);
            font-size: 18px;
            font-weight: bold;
            text-shadow: 0 0 20px var(--neon-green), 0 0 40px var(--neon-green);
            animation: glow-pulse 0.5s ease-in-out 3;
        }

        .access-granted-box {
            border: 3px solid var(--neon-green);
            padding: 20px;
            margin: 15px 0;
            text-align: center;
            animation: accessGrantedAnim 0.5s ease-out, borderGlow 1s ease-in-out infinite;
            background: rgba(0, 255, 65, 0.1);
        }

        @keyframes accessGrantedAnim {
            0% { transform: scale(0.5); opacity: 0; }
            50% { transform: scale(1.1); }
            100% { transform: scale(1); opacity: 1; }
        }

        @keyframes borderGlow {
            0%, 100% { box-shadow: 0 0 20px var(--neon-green), inset 0 0 20px rgba(0, 255, 65, 0.1); }
            50% { box-shadow: 0 0 40px var(--neon-green), inset 0 0 30px rgba(0, 255, 65, 0.2); }
        }

        .access-denied {
            color: var(--red);
            font-size: 18px;
            font-weight: bold;
            text-shadow: 0 0 20px var(--red), 0 0 40px var(--red);
            animation: shake 0.5s ease-in-out;
        }

        .access-denied-box {
            border: 3px solid var(--red);
            padding: 20px;
            margin: 15px 0;
            text-align: center;
            animation: accessDeniedAnim 0.5s ease-out, borderGlowRed 1s ease-in-out infinite;
            background: rgba(255, 0, 64, 0.1);
        }

        @keyframes accessDeniedAnim {
            0%, 20%, 40%, 60%, 80%, 100% { transform: translateX(0); }
            10%, 50%, 90% { transform: translateX(-10px); }
            30%, 70% { transform: translateX(10px); }
        }

        @keyframes borderGlowRed {
            0%, 100% { box-shadow: 0 0 20px var(--red), inset 0 0 20px rgba(255, 0, 64, 0.1); }
            50% { box-shadow: 0 0 40px var(--red), inset 0 0 30px rgba(255, 0, 64, 0.2); }
        }

        @keyframes glow-pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.5; }
        }

        @keyframes shake {
            0%, 100% { transform: translateX(0); }
            20%, 60% { transform: translateX(-5px); }
            40%, 80% { transform: translateX(5px); }
        }

        /* Progress Bar */
        .progress-container {
            background: #1a1a1a;
            border: 1px solid var(--neon-green);
            border-radius: 3px;
            height: 20px;
            margin: 10px 0;
            overflow: hidden;
            position: relative;
        }

        .progress-bar {
            height: 100%;
            background: linear-gradient(90deg, var(--dark-green), var(--neon-green));
            box-shadow: 0 0 20px var(--neon-green);
            transition: width 0.1s linear;
        }

        .progress-text {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            color: white;
            font-size: 12px;
            text-shadow: 0 0 5px black;
        }

        /* Glitch Effect */
        .glitch {
            animation: glitch-anim 0.3s linear infinite;
        }

        @keyframes glitch-anim {
            0% { text-shadow: 2px 0 var(--red), -2px 0 var(--cyan); }
            25% { text-shadow: -2px 0 var(--red), 2px 0 var(--cyan); }
            50% { text-shadow: 2px 0 var(--cyan), -2px 0 var(--red); }
            75% { text-shadow: -2px 0 var(--cyan), 2px 0 var(--red); }
            100% { text-shadow: 2px 0 var(--red), -2px 0 var(--cyan); }
        }

        /* ASCII Art */
        .ascii-art {
            font-size: 10px;
            line-height: 1.2;
            color: var(--neon-green);
            white-space: pre;
        }

        /* Boot Screen */
        .boot-screen {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: var(--bg-dark);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 2000;
            flex-direction: column;
        }

        .boot-text {
            color: var(--neon-green);
            font-size: 16px;
            text-shadow: 0 0 10px var(--neon-green);
            text-align: center;
            max-width: 600px;
            padding: 20px;
        }

        /* File Tree Styles */
        .file-tree {
            margin-left: 20px;
        }

        .file-tree-item {
            padding: 2px 0;
        }

        .folder {
            color: var(--cyan) !important;
            cursor: pointer;
            transition: all 0.2s;
        }

        .folder:hover {
            color: var(--neon-green) !important;
            text-shadow: 0 0 10px var(--neon-green);
            padding-left: 5px;
        }

        .file {
            color: var(--neon-green) !important;
            cursor: pointer;
            transition: all 0.2s;
        }

        .file:hover {
            color: var(--cyan) !important;
            text-shadow: 0 0 10px var(--cyan);
            padding-left: 5px;
        }

        .file-size {
            color: #666;
            margin-left: 15px;
        }

        .file-content-box {
            background: rgba(0, 0, 0, 0.8);
            border: 2px solid var(--cyan);
            border-radius: 5px;
            padding: 15px;
            margin: 10px 0;
            animation: fileOpen 0.3s ease-out;
        }

        @keyframes fileOpen {
            from { opacity: 0; transform: scaleY(0); }
            to { opacity: 1; transform: scaleY(1); }
        }

        .file-header {
            color: var(--cyan);
            font-weight: bold;
            margin-bottom: 10px;
            padding-bottom: 5px;
            border-bottom: 1px solid var(--cyan);
        }

        .file-content {
            color: var(--neon-green);
            white-space: pre-wrap;
            font-size: 13px;
            line-height: 1.5;
        }

        /* System Message */
        .system-message {
            position: fixed;
            bottom: 20px;
            right: 20px;
            background: rgba(0, 10, 0, 0.95);
            border: 1px solid var(--neon-green);
            padding: 15px 20px;
            border-radius: 5px;
            color: var(--neon-green);
            font-size: 12px;
            z-index: 1500;
            animation: slideIn 0.5s ease, fadeOut 0.5s ease 4.5s forwards;
            box-shadow: 0 0 20px rgba(0, 255, 65, 0.3);
            max-width: 300px;
        }

        @keyframes slideIn {
            from { transform: translateX(100%); opacity: 0; }
            to { transform: translateX(0); opacity: 1; }
        }

        @keyframes fadeOut {
            to { opacity: 0; transform: translateX(100%); }
        }

        .system-message .msg-header {
            color: var(--cyan);
            font-weight: bold;
            margin-bottom: 5px;
        }

        /* Sound Toggle */
        .sound-toggle {
            position: fixed;
            top: 20px;
            right: 20px;
            background: rgba(0, 255, 65, 0.1);
            border: 1px solid var(--neon-green);
            color: var(--neon-green);
            padding: 10px;
            cursor: pointer;
            font-family: inherit;
            font-size: 16px;
            border-radius: 50%;
            width: 45px;
            height: 45px;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.3s;
            z-index: 1500;
        }

        .sound-toggle:hover {
            background: rgba(0, 255, 65, 0.3);
            box-shadow: 0 0 20px var(--neon-green);
            transform: scale(1.1);
        }

        .sound-toggle.muted {
            opacity: 0.5;
        }

        /* Mobile Responsive */
        @media (max-width: 768px) {
            .terminal-container {
                margin: 10px;
                padding: 10px;
                height: calc(100vh - 20px);
            }

            .terminal-title {
                font-size: 11px;
            }

            #output, #command-input {
                font-size: 12px;
            }

            .ascii-art {
                font-size: 5px;
            }

            .terminal-header {
                padding: 8px 12px;
            }

            .terminal-body {
                padding: 15px;
            }

            .command-menu {
                top: 5px;
                right: 5px;
            }

            .menu-toggle {
                padding: 5px 10px;
                font-size: 10px;
            }

            .sound-toggle {
                top: 10px;
                right: 10px;
                width: 35px;
                height: 35px;
                font-size: 14px;
            }

            .system-message {
                bottom: 10px;
                right: 10px;
                left: 10px;
                max-width: none;
            }
        }
    </style>
</head>

    <script>
        // Realistic Audio Context for Sound Effects
        let audioContext;
        let soundEnabled = true;

        function initAudio() {
            audioContext = new (window.AudioContext || window.webkitAudioContext)();
        }

        function playSound(type) {
            if (!soundEnabled || !audioContext) return;
            
            const now = audioContext.currentTime;
            
            switch(type) {
                case 'keypress':
                    // Realistic mechanical keyboard click
                    const keyOsc = audioContext.createOscillator();
                    const keyGain = audioContext.createGain();
                    const keyNoise = audioContext.createBufferSource();
                    
                    // Create white noise for click
                    const buffer = audioContext.createBuffer(1, audioContext.sampleRate * 0.02, audioContext.sampleRate);
                    const data = buffer.getChannelData(0);
                    for (let i = 0; i < data.length; i++) {
                        data[i] = Math.random() * 2 - 1;
                    }
                    keyNoise.buffer = buffer;
                    
                    const noiseFilter = audioContext.createBiquadFilter();
                    noiseFilter.type = 'bandpass';
                    noiseFilter.frequency.value = 3000 + Math.random() * 2000;
                    
                    keyNoise.connect(noiseFilter);
                    noiseFilter.connect(keyGain);
                    keyGain.connect(audioContext.destination);
                    keyGain.gain.value = 0.03;
                    keyGain.gain.exponentialRampToValueAtTime(0.001, now + 0.02);
                    
                    keyNoise.start(now);
                    keyNoise.stop(now + 0.02);
                    break;
                    
                case 'enter':
                    // Enter key sound
                    const enterNoise = audioContext.createBufferSource();
                    const enterGain = audioContext.createGain();
                    const enterBuffer = audioContext.createBuffer(1, audioContext.sampleRate * 0.05, audioContext.sampleRate);
                    const enterData = enterBuffer.getChannelData(0);
                    for (let i = 0; i < enterData.length; i++) {
                        enterData[i] = Math.random() * 2 - 1;
                    }
                    enterNoise.buffer = enterBuffer;
                    
                    const enterFilter = audioContext.createBiquadFilter();
                    enterFilter.type = 'lowpass';
                    enterFilter.frequency.value = 1500;
                    
                    enterNoise.connect(enterFilter);
                    enterFilter.connect(enterGain);
                    enterGain.connect(audioContext.destination);
                    enterGain.gain.value = 0.08;
                    enterGain.gain.exponentialRampToValueAtTime(0.001, now + 0.05);
                    
                    enterNoise.start(now);
                    enterNoise.stop(now + 0.05);
                    break;
                    
                case 'success':
                    // Success notification sound
                    const successOsc = audioContext.createOscillator();
                    const successGain = audioContext.createGain();
                    successOsc.connect(successGain);
                    successGain.connect(audioContext.destination);
                    
                    successOsc.frequency.value = 800;
                    successOsc.type = 'sine';
                    successGain.gain.value = 0.1;
                    successOsc.start(now);
                    successOsc.frequency.exponentialRampToValueAtTime(1200, now + 0.15);
                    successGain.gain.exponentialRampToValueAtTime(0.001, now + 0.15);

                const fullPath = path + '/' + key;

                    result += `<div class="file-tree-item"><span class="folder" data-path="${fullPath}">${prefix}📁 ${key}/</span></div>`;

            item.addEventListener('click', async () => {
                const cmd = item.dataset.cmd;
                menuDropdown.classList.remove('active');
                commandInput.value = cmd;
                await executeCommand(cmd);
            });
        });

        // Close menu when clicking outside
        document.addEventListener('click', (e) => {
            if (!e.target.closest('.command-menu')) {
                menuDropdown.classList.remove('active');
            }
        });

        // Focus input when clicking terminal
        terminalBody.addEventListener('click', (e) => {
            if (!e.target.closest('.command-menu')) {
                commandInput.focus();
            }
        });

        // File click handler (event delegation)
        output.addEventListener('click', async (e) => {
            if (e.target.classList.contains('file')) {
                const filename = e.target.dataset.filename;
                if (filename) {
                    commandInput.disabled = true;
                    await typeOutput(`> Opening file: ${filename}...`, 20);
                    await sleep(300);
                    await openFile(filename);
                    commandInput.disabled = false;
                    commandInput.focus();
                }
            }
        });

        // Random screen glitch effect
        function randomGlitch() {
            if (Math.random() > 0.97) {
                document.body.style.filter = 'hue-rotate(90deg)';
                flashGlitch();
                setTimeout(() => {
                    document.body.style.filter = 'none';
                }, 50);
            }
            setTimeout(randomGlitch, 100);
        }

        // Initialize
        createMatrixRain();
        bootSequence();
        randomGlitch();

        // Initialize audio on first click
        document.body.addEventListener('click', () => {
            if (!audioContext) initAudio();
        }, { once: true });
    </script>
</body>
</html>
